# render.yaml — Render Blueprint (バックエンド Web Service)
# ダッシュボードで「Blueprint」から本ファイルを読み込むと、backend が下記設定で作成される。
# 注意: 無料プランはスリープするため使わない。必ず Starter (有料・常時稼働) を選ぶこと。
services:
  - type: web
    name: hybrid-macro-desk-api
    runtime: python
    rootDir: backend
    plan: starter                       # 月$7固定・常時稼働 (24h HL巡回するため必須)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn liqmap_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Renderダッシュボードで手入力する秘密情報 (sync:false = リポジトリに値を持たない)
      - key: ANTHROPIC_API_KEY
        sync: false                     # 未設定なら AI Overview はルールベース文
      - key: FINNHUB_API_KEY
        sync: false                     # 未設定なら経済カレンダーは Deribit満期のみ
      - key: FRONTEND_ORIGIN
        sync: false                     # Vercel のURL (例 https://xxx.vercel.app)。CORS許可元
      # --- メモリ保護 (Starter=512MB 前提。値は render.yaml に直接持つ) ---
      - key: LIQMAP_MAX_ADDRESSES
        value: "6000"                   # 追跡アドレス上限。超過分は追加せずメモリ増加を止める
      - key: LIQMAP_LEADERBOARD_N
        value: "1500"                   # 起動時に投入する大口アドレス数 (少ないほど省メモリ)
      - key: LIQMAP_LEADERBOARD_MAX_MB
        value: "15"                     # リーダーボード取得のバイト上限。超過回はスキップしOOMを防ぐ
      # もし上記でもOOMが続くなら、リーダーボードを完全無効化 (Smart Money/大口初期投入を諦める):
      #   LIQMAP_DISABLE_LEADERBOARD = 1
      # COINGLASS_API_KEY は現方針では不要
